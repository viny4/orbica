name: Deploy Orbica

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Frontend
        working-directory: ./web
        run: |
          npm install
          npm run build

      - name: Build Go Services
        run: |
          go build -o bin/api ./services/api/cmd/server
          go build -o bin/analytics ./services/analytics/cmd/server

      # Add deployment steps for Render and Cloudflare Pages here using their respective actions or webhooks
      # e.g., curl -X POST https://api.render.com/deploy/srv-...
