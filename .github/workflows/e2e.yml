name: E2E (smoke)

# Runs the Playwright suite against a live deployment. Defaults to production;
# override the URL on a manual run. Full local runs use `npm run test:e2e`
# against the dev stack (web :3000 + API :8090).
on:
  schedule:
    - cron: "0 7 * * *" # daily
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        default: "https://orbica.space"

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E against the live site
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || vars.E2E_BASE_URL || 'https://orbica.space' }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
