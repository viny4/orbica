name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render's free tier from sleeping (sleeps after 15 mins)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          echo "Pinging backend to keep it awake..."
          curl -sS https://${{ secrets.PROD_API_URL }}/api/v1/track/meta > /dev/null
          echo "Ping successful!"
