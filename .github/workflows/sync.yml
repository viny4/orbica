name: Orbica Data Sync

on:
  schedule:
    # Every 6 hours. Each run keeps the auto-suspending Neon DB awake for
    # ~20 min, so cadence is a direct compute cost — 4/day fits the free tier
    # comfortably, 6/day was borderline. Launch/TLE freshness barely differs.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    name: Sync Space Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/pipeline/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r services/pipeline/requirements.txt
          pip install -r services/intel/requirements.txt

      - name: Run Sync Script
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SPACE_TRACK_USER: ${{ secrets.SPACE_TRACK_USER }}
          SPACE_TRACK_PASS: ${{ secrets.SPACE_TRACK_PASS }}
        working-directory: services/pipeline
        run: |
          python -m src.sync.refresh

      # Computed "space intelligence" — keeps space_weather, reentries and
      # conjunctions fresh. Each is best-effort so one failure can't block the run.
      - name: Refresh Intel (space weather, reentry, conjunctions)
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        working-directory: services/intel
        run: |
          python -m src.spaceweather || echo "spaceweather step failed"
          python -m src.reentry      || echo "reentry step failed"
          python -m src.conjunctions || echo "conjunctions step failed"
